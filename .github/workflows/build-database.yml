name: Build Database

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'builder/**'
      - 'Aptiv/**'
      - 'Bosch/**'
      - 'TE/**'
      - 'Universal/**'
      - '.github/workflows/build-database.yml'

permissions:
  contents: write   # only needed for the release step

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Run builder
        run: python builder/build_database.py

      - name: Package build output
        run: (cd build && zip -r -q ../harness_designer_database.zip .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness_designer_database
          path: harness_designer_database.zip
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Database v${{ steps.version.outputs.version }}
          files: harness_designer_database.zip
